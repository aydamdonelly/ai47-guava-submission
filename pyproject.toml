[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartset-api"
version = "0.1.0"
description = "Smartset retention API for the Guava Build Night demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
smartset-api = "smartset_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["smartset_api"]
