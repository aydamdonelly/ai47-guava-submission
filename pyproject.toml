[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "care-signal"
version = "0.1.0"
description = "CareSignal voice request-routing demo for Guava Build Night"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
care-signal = "care_signal.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["care_signal"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
