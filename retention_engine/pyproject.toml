[project]
name = "dailyfuel-retention-engine"
version = "0.1.0"
description = "Guava-native qualitative retention research demo"
requires-python = ">=3.11"
dependencies = [
    "guava-sdk==0.40.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
